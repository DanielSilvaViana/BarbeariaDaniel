services:
  postgres:
    image: postgres:17

    container_name: barbearia-postgres

    restart: unless-stopped

    environment:
      POSTGRES_DB: barbearia_daniel
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD no arquivo .env (veja .env.example)}

    ports:
      - "5432:5432"

    volumes:
      - postgres-data:/var/lib/postgresql/data

volumes:
  postgres-data: